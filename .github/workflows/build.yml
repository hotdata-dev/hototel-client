name: build

on:
  push:
  pull_request:

# this job only compiles and uploads artifacts; it never needs write scope
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Tests
        run: cargo test --release
      - name: Smoke test (parse + dump on an empty machine)
        if: runner.os != 'Windows'
        run: ./target/release/hototel dump | head -c 200; echo
      # the skill file is embedded at compile time, so a broken template is a
      # build-time problem worth catching here rather than on someone's laptop
      - name: Smoke test (skill renders)
        if: runner.os != 'Windows'
        run: |
          ./target/release/hototel skill install
          test -f "$HOME/.claude/skills/hototel/SKILL.md"
          grep -q "name: hototel" "$HOME/.claude/skills/hototel/SKILL.md"
          ! grep -q "{{" "$HOME/.claude/skills/hototel/SKILL.md"
      - uses: actions/upload-artifact@v4
        with:
          name: hototel-${{ matrix.target }}
          path: |
            target/release/hototel
            target/release/hototel.exe
          if-no-files-found: error
