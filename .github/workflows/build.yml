name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Smoke test (parse + dump on an empty machine)
        if: runner.os != 'Windows'
        run: ./target/release/hotusage-collector --dump | head -c 200; echo
      - uses: actions/upload-artifact@v4
        with:
          name: hotusage-collector-${{ matrix.target }}
          path: |
            target/release/hotusage-collector
            target/release/hotusage-collector.exe
          if-no-files-found: error
