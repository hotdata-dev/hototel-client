name: release

# Tag v* -> build the binary for every OS and attach it to a GitHub Release.
# workflow_dispatch builds the same archives without publishing a release
# (grab them from the run's artifacts).
#
# Deliberately just binaries: install.sh downloads the right archive, drops the
# binary on PATH and registers the background agent. No .app bundle, no .deb, no
# Windows installer -- and so no code signing either, since curl-installed files
# are never quarantined and Gatekeeper never sees them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          # 22.04 keeps the glibc floor low (2.35) for older distros
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Version
        id: v
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V="${{ steps.v.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $V - bump Cargo.toml (and Cargo.lock) or retag" >&2
            exit 1
          fi

      - name: Build & archive (macOS universal)
        if: runner.os == 'macOS'
        run: |
          V="${{ steps.v.outputs.version }}"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/hotusage-collector \
            target/aarch64-apple-darwin/release/hotusage-collector \
            target/x86_64-apple-darwin/release/hotusage-collector
          tar -C dist -czf "dist/hotusage-collector-$V-macos-universal.tar.gz" hotusage-collector
          rm -f dist/hotusage-collector

      - name: Build & archive (Linux)
        if: runner.os == 'Linux'
        run: |
          V="${{ steps.v.outputs.version }}"
          cargo build --release
          mkdir -p dist
          tar -C target/release -czf "dist/hotusage-collector-$V-linux-x86_64.tar.gz" hotusage-collector

      - name: Build & archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $V = "${{ steps.v.outputs.version }}"
          cargo build --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/hotusage-collector.exe -DestinationPath "dist/hotusage-collector-$V-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --generate-notes \
            --title "hotusage-collector $GITHUB_REF_NAME"
